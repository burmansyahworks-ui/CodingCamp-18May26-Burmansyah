<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@400;700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="dashboard-header">
    <div class="header-left">
      <span class="header-tag">DSHBRD.SYS</span>
      <span class="header-version">v2.6</span>
    </div>
    <div class="header-right">
      <button type="button" id="theme-toggle" class="header-btn" aria-label="Toggle dark mode">◐</button>
      <button type="button" id="settings-toggle" class="header-btn" aria-label="Open settings">⚙</button>
    </div>
  </header>

  <!-- Settings Panel -->
  <div id="settings-panel" class="settings-panel" style="display:none;">
    <div class="settings-content">
      <h2>// SETTINGS</h2>
      <div class="settings-group">
        <label for="setting-name">OPERATOR NAME</label>
        <input type="text" id="setting-name" placeholder="Enter name..." maxlength="30">
      </div>
      <div class="settings-group">
        <label for="setting-pomodoro">FOCUS DURATION (MIN)</label>
        <input type="number" id="setting-pomodoro" min="1" max="120" value="25">
      </div>
      <div class="settings-actions">
        <button type="button" id="settings-save" class="btn-save">SAVE</button>
        <button type="button" id="settings-close" class="btn-close">CLOSE</button>
      </div>
    </div>
  </div>

  <main class="dashboard">
    <!-- Greeting/Time - Yellow card (full width top-left area) -->
    <section id="greeting-widget" class="widget widget-time" aria-label="Greeting and time display">
    </section>

    <!-- Tasks - Red card (tall, left side) -->
    <section id="todo-list" class="widget widget-tasks" aria-label="To-do list">
    </section>

    <!-- Focus Timer - Green card (bottom center) -->
    <section id="focus-timer" class="widget widget-timer" aria-label="Focus timer">
    </section>

    <!-- Quick Links - Gray card (bottom right) -->
    <section id="quick-links" class="widget widget-links" aria-label="Quick links">
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
